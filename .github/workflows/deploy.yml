name: Deploy Sprint-7 Enterprise Form Infrastructure to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Web Bundle
        run: npm run build

      - name: Ensure .nojekyll & 404 fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          mkdir -p docs
          cp -r dist/* docs/
          touch docs/.nojekyll

      - name: Deploy to GitHub Pages Source Branch
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
